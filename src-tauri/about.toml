# cargo-about の設定。`npm run licenses` で licenses/THIRD_PARTY_LICENSES_RUST.txt を生成する
# 本体(MIT)と両立するライセンスのみ許可する。新しいライセンスの依存を追加したらここに追記する
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
]
# 配布物に含まれない依存(ビルド時のみ・開発時のみ)は除外する
ignore-build-dependencies = true
ignore-dev-dependencies = true
