pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --write {staged_files}
      stage_fixed: true

    rust-fmt:
      root: "src-tauri/"
      glob: "**/*.rs"
      run: cargo fmt
      stage_fixed: true

    rust-clippy:
      root: "src-tauri/"
      glob: "**/*.rs"
      run: cargo clippy -- -D warnings